# Applicationspring.application.name=notification-serviceserver.port=8086# Gere LocalDateTime avec Jacksonspring.jackson.serialization.write-dates-as-timestamps=false# Kafkaspring.kafka.bootstrap-servers=localhost:9092spring.kafka.consumer.group-id=notification-service-groupspring.kafka.consumer.auto-offset-reset=earliestspring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializerspring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer# Novunovu.api.url=https://api.novu.conovu.api.key=${NOVU_API_KEY}# User Serviceuser-service.url=http://localhost:8082# Org Serviceorg-service.url=http://localhost:8083