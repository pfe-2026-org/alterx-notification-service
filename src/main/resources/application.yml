spring:  security:    oauth2:      resourceserver:        jwt:          issuer-uri: ${KEYCLOAK_ISSUER_URI}      client:        registration:          notification-service-user:            provider: keycloak            client-id: notification-service            client-secret: ${KEYCLOAK_NOTIFICATION_SERVICE_CLIENT_SECRET}            authorization-grant-type: client_credentials            scope: user-service-access          notification-service-org:            provider: keycloak            client-id: notification-service            client-secret: ${KEYCLOAK_NOTIFICATION_SERVICE_CLIENT_SECRET}            authorization-grant-type: client_credentials            scope: org-service-access          notification-service-change:            provider: keycloak            client-id: notification-service            client-secret: ${KEYCLOAK_NOTIFICATION_SERVICE_CLIENT_SECRET}            authorization-grant-type: client_credentials            scope: change-service-access        provider:          keycloak:            token-uri: ${KEYCLOAK_ISSUER_URI}/protocol/openid-connect/tokenfeign:  clients:    user-service:      url: ${USER_SERVICE_URL}    org-service:      url: ${ORG_SERVICE_URL}    change-service:      url: ${CHANGE_SERVICE_URL}