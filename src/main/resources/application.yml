spring:  application:    name: notification-service  kafka:    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}  security:    oauth2:      resourceserver:        jwt:          issuer-uri: ${KEYCLOAK_ISSUER_URI}      client:        registration:          notification-service-user:            provider: keycloak            client-id: ${KEYCLOAK_NOTIFICATION_SERVICE_CLIENT_ID}            client-secret: ${KEYCLOAK_NOTIFICATION_SERVICE_CLIENT_SECRET}            authorization-grant-type: client_credentials          notification-service-org:            provider: keycloak            client-id: ${KEYCLOAK_NOTIFICATION_SERVICE_CLIENT_ID}            client-secret: ${KEYCLOAK_NOTIFICATION_SERVICE_CLIENT_SECRET}            authorization-grant-type: client_credentials          notification-service-change:            provider: keycloak            client-id: ${KEYCLOAK_NOTIFICATION_SERVICE_CLIENT_ID}            client-secret: ${KEYCLOAK_NOTIFICATION_SERVICE_CLIENT_SECRET}            authorization-grant-type: client_credentials        provider:          keycloak:            token-uri: ${KEYCLOAK_ISSUER_URI}/protocol/openid-connect/tokenmanagement:  endpoints:    web:      exposure:        include: health,info,metrics,prometheus  endpoint:    health:      show-details: when-authorizedserver:  port: ${SERVER_PORT}feign:  clients:    user-service:      url: ${USER_SERVICE_URL}    org-service:      url: ${ORG_SERVICE_URL}    change-service:      url: ${CHANGE_SERVICE_URL}novu:  api:    url: ${NOVU_API_URL}    key: ${NOVU_API_KEY}